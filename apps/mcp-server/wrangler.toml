name = "manako-mcp-server"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SESSION_KV"
# `wrangler kv namespace create SESSION_KV` で作成した namespace の id に置き換える（README「セルフホスティング」参照）
id = "<YOUR_KV_NAMESPACE_ID>"

[vars]
ENVIRONMENT = "production"
# 自前の Manako API を使う場合は差し替える
API_URL = "https://api.manako.dev"
